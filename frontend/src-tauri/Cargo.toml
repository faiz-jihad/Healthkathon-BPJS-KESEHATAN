[package]
name = "aura-jkn-desktop"
version = "1.0.0"
description = "AURA-JKN: Sistem Skrining Pra-Pembayaran BPJS Kesehatan"
authors = ["Tim AURA-JKN BPJS Kesehatan <hackathon@mataceria.my.id>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
