services:
  # 1. Authoritative PostgreSQL Database (Port 5432)
  postgres:
    image: postgres:16-alpine
    container_name: aura_jkn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: aura_jkn_db
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_jkn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python R-GCN, Spatiotemporal & LLM AI Service (Port 8000)
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: aura_jkn_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://aura_user:aura_password@postgres:5432/aura_jkn_db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-auto}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-auto}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-3.0}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Next.js 14 Backend API Service (Port 3001)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura_jkn_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://aura_user:aura_password@postgres:5432/aura_jkn_db?schema=public"
      AI_SERVICE_URL: "http://ai-service:8000"
      PORT: 3001
      AUTH_SECRET: ${AUTH_SECRET:-aura-jkn-production-auth-secret-healthkathon-2026-bpjs-secure-token-vault}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-auto}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-auto}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-3.0}
    depends_on:
      postgres:
        condition: service_healthy
    command: npm start

  # 4. React 18 + Vite Frontend Dashboard (Port 5173 & 80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura_jkn_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
