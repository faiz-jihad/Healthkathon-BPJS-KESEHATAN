version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura_jkn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: aura_jkn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_jkn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
